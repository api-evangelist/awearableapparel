name: Awearableapparel

image: https://lynq.io/images/darker-new.jpg

description: 'Awearableapparel, operating as Lynq, provides location-based off‑grid wearable technology that enables real‑time person‑to‑person location sharing up to five miles without reliance on phones, cellular networks, or infrastructure. The platform offers a smart compass, emergency alerts, and a developer API for integrating geolocation services into applications, targeting industries such as safety, logistics, and outdoor recreation. Founded in 2014 and based in Brooklyn, NY, Lynq is a Techstars and HAX alumni with $2.6M total funding.'

